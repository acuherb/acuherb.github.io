name: Hugo build and deploy

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# 设置权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.120.4"  # FixIt主题推荐版本

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 重要！确保主题被拉取
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true  # FixIt需要extended版本

      - name: Check for package.json
        id: check_package
        run: |
          if [ -f "package.json" ]; then
            echo "package_exists=true" >> $GITHUB_OUTPUT
          else
            echo "package_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js (if needed)
        if: steps.check_package.outputs.package_exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node.js dependencies (if needed)
        if: steps.check_package.outputs.package_exists == 'true'
        run: |
          # 如果有package.json但没有package-lock.json，使用npm install
          if [ -f "package-lock.json" ]; then
            echo "Using npm ci (package-lock.json exists)"
            npm ci
          else
            echo "Using npm install (no package-lock.json)"
            npm install
          fi

      - name: Hugo build
        run: |
          # 添加详细日志以便调试
          echo "Building with Hugo version:"
          hugo version
          echo "Starting Hugo build..."
          hugo --gc --minify --logLevel info
          echo "Build completed!"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4