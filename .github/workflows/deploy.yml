name: Hugo build and deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

env:
  # 使用与你本地完全相同的版本
  HUGO_VERSION: "0.152.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo (exact version)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Debug info
        run: |
          echo "=== Debug Information ==="
          echo "Hugo version:"
          hugo version
          echo "Current directory:"
          pwd
          ls -la
          echo "Theme directory:"
          ls -la themes/

      - name: Build with Hugo (verbose)
        run: |
          # 尝试不同的构建命令
          echo "Building site..."
          hugo --verbose
          
          # 如果失败，尝试不带permalink
          # hugo --verbose --disableKinds=term,taxonomy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4